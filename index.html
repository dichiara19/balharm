<!-- Google Analytics 4 (gtag.js). The Bh.lib.analytics facade (loaded below)
     wraps this so the app never calls gtag directly. Local dev traffic is kept
     out of the real metrics: config — and its automatic page_view — fires only
     off-localhost, and the facade mirrors the same guard. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H1GNYFWKNZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  window.gtag = gtag;
  gtag('js', new Date());
  if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
    gtag('config', 'G-H1GNYFWKNZ');
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<!-- Cesium 1.124 (npm): vite.config.js lo copia in dist/cesium/ e inietta qui
     widgets.css, CESIUM_BASE_URL e lo <script> classico Cesium.js (esposto come
     globale `Cesium`, eseguito prima del bundle src/main.js). -->

<!-- Local dev override: loads dev.local.js (gitignored) only on localhost,
     setting window.CESIUM_ION_TOKEN to the unrestricted dev token so Cesium
     ion works from any local origin. In production dev.local.js does not
     exist and the URL-restricted prod token hard-coded in scene.js is used. -->
<script>
  if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
    document.write('<script src="dev.local.js"><\/script>');
  }
</script>

<!-- Bal'harm: tutto il codice (dati, i18n, scena Cesium, UI React con JSX già
     compilato) è un unico bundle Vite; React arriva da npm (src/globals.js). -->
<script type="module" src="/src/main.js"></script>
